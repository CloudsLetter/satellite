---
kind: pipeline
type: exec
name: statellite

platform:
  os: linux
  arch: amd64

steps:
- name: build
  commands:
    - docker build -t wojiuchigua/satellite:latest .

- name: sentry
  commands:
    - SENTRY_AUTH_TOKEN=1939832c36ebbc72f6025db543c380df5c8ed4d11b6110d74da8604764489650
    - SENTRY_ORG=cloudyun-aq
    - SENTRY_PROJECT=satellite
    - VERSION=`sentry-cli releases propose-version`
    - sentry-cli releases new "$VERSION"
    - sentry-cli releases set-commits --auto "$VERSION"
    - sentry-cli releases finalize "$VERSION"

- name: webhook
  commands:
    - curl -X POST -k https://127.0.0.1:9443/api/stacks/webhooks/5f385d8d-8d21-46d8-9cb0-f6baa6f8d941
